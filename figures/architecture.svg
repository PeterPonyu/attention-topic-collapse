<text x="222" y="551" font-size="18" text-anchor="middle">Shortfall = max(0, 0.1 − mean KL)</text><text x="744" y="518" font-size="18" text-anchor="middle">Simplex concentration and between-cell collapse</text><text x="744" y="542" font-size="18" text-anchor="middle">are measured separately.</text><path d="M 25 562 H 1015" stroke="#c7d3d9" stroke-width="1" /><text x="20" y="595" font-size="24" text-anchor="start" font-weight="bold">C</text><text x="520" y="595" font-size="22" text-anchor="middle">Interventions act on complete tokens or batch context</text><text x="270" y="629" font-size="17" text-anchor="middle">Token order: reverse tokens with their embeddings</text>
<text x="270" y="652" font-size="17" text-anchor="middle">Content: repeat mean token or first complete token</text>
<text x="270" y="675" font-size="17" text-anchor="middle">Context: alter companions, reverse batch, isolate cells</text><text x="789" y="629" font-size="17" text-anchor="middle">Restore trained state; keep encoder parameters fixed</text>
<text x="789" y="652" font-size="17" text-anchor="middle">Allocation change is measured after the full route</text>
<text x="789" y="675" font-size="17" text-anchor="middle">Gaussian control has no simplex and changes the objective</text>
